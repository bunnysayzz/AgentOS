name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        # npm install (not npm ci): the lockfile is generated by a newer npm
        # (v11) than the runner's bundled npm (v10), and `npm ci` hard-fails on
        # the resulting resolution drift (e.g. "Missing: esbuild@0.28.2 from
        # lock file"). This matches the Dockerfile, so CI == deploy exactly.
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build (deploy parity)
        # Mirrors the Docker build step — catches deploy-breaking build errors
        # in CI before they ever reach Render.
        run: npm run build
      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      # firebase.ts throws at import when VITE_FIREBASE_* are missing, so the
      # dev server would serve a crashing bundle. Dummy values pass the guard
      # and are safe: the E2E flows don't depend on Firebase succeeding.
      - name: Create frontend env for E2E
        run: |
          cat > frontend/.env <<'EOF'
          VITE_API_URL=http://127.0.0.1:8000/api/v1
          VITE_FIREBASE_API_KEY=dummy
          VITE_FIREBASE_AUTH_DOMAIN=dummy.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=dummy
          VITE_FIREBASE_STORAGE_BUCKET=dummy.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID=dummy
          VITE_FIREBASE_APP_ID=dummy
          EOF
      - name: Create backend env for E2E
        run: |
          cat > backend/.env <<'EOF'
          CORS_ORIGINS=["http://127.0.0.1:5173","http://localhost:5173","http://localhost:3000"]
          SECRET_KEY=e2e-ci-secret-not-for-production
          ENCRYPTION_KEY=e2e-ci-encryption-key-not-for-production
          EOF
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
