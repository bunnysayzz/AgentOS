# ─────────────────────────────────────────────────────────────────────────────
# Keep Alive + Uptime Alerting — prevents Render free-tier cold starts and
# notifies you when the site goes down.
# ─────────────────────────────────────────────────────────────────────────────
# Render free-tier instances spin down after ~15 minutes without traffic, and
# the first request after idle takes 30–60 s to boot.
#
# Every 10 minutes this workflow pings /health so the instance never idles out.
# If the site stays unhealthy across retries (transient blips don't alert),
# the job FAILS — GitHub Actions emails the repo owner about failed scheduled
# workflows, giving you free uptime alerting. You can also add a Discord/Slack
# webhook to on:schedule failure via the Actions UI.
#
# Cost: ~6 minutes of runner time per day, well within free limits.
# ─────────────────────────────────────────────────────────────────────────────

name: Keep Alive + Uptime

on:
  schedule:
    # Every 10 minutes, every day
    - cron: '*/10 * * * *'
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  ping:
    name: Ping Render service
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (3 retries to ignore transient blips)
        run: |
          ok=0
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 https://letsagentos.onrender.com/health || echo 000)
            echo "attempt $attempt → HTTP $code"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::AgentOS health check failed after 3 attempts — the site may be DOWN."
            exit 1
          fi
          echo "✅ Service is healthy"
