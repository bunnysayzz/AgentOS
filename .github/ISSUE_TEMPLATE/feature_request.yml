name: Feature request
description: Suggest an idea for AgentOS Studio
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an idea. Clear proposals get built faster.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow or gap this feature addresses.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the feature look or behave like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything you tried or workarounds you use today.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Where should this live?
      options:
        - label: Frontend / UI
        - label: Backend / API
        - label: Documentation
        - label: Infrastructure / deployment
