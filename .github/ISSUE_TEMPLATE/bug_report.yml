name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report. Security issues should be reported privately — see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger it?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Scroll down to ...
        4. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots or logs
      description: Paste screenshots, browser console output, or server logs. Redact any API keys first.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Deployment mode (Docker, Render, local dev) and version/commit if known.
      placeholder: e.g. Docker · commit abc1234
    validations:
      required: true
