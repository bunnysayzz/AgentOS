# ─────────────────────────────────────────────────────────────────────────────
# AgentOS Studio — Render Blueprint (render.yaml)
# ─────────────────────────────────────────────────────────────────────────────
# Single-service deployment: one URL hosts everything.
#
#   https://agentos.onrender.com          → main React app (frontend)
#   https://agentos.onrender.com/admin    → backend admin console (Swagger UI)
#   https://agentos.onrender.com/api/v1/* → backend API
#   https://agentos.onrender.com/health   → health check
#
# To deploy (either way works):
#
#   A) Blueprint  →  Render "New +" → "Blueprint" → connect this repo.
#      Render creates ONE web service ("agentos") using the native Python
#      runtime and the build/start commands below.
#
#   B) Web Service  →  Render "New +" → "Web Service" → connect this repo.
#      Render auto-detects the root Dockerfile and builds the same single-
#      service image (frontend + backend in one container).
#
#   Then fill in the env vars marked `sync: false` (secrets) — the blueprint
#   prompts for them during first deploy.
#
# Firebase is the ONLY data store: users, workspaces, agents and everything
# else live in Cloud Firestore. The backend verifies Firebase ID tokens and
# reads/writes Firestore directly — no SQL database is required.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: agentos
    runtime: python
    rootDir: backend
    plan: free
    region: singapore # closest Render region to the primary user base
    buildCommand: |
      npm --prefix ../frontend ci
      npm --prefix ../frontend run build
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 22.18.0
      # Same-origin: the SPA is served from the same host as the API, so a
      # relative base URL works and no CORS config is required.
      - key: VITE_API_URL
        value: /api/v1
      # Firebase web config — enables Google Sign-In (frontend).
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      # Backend Firestore credentials — see backend/.env.example.
      # Preferred (production-grade): paste the full service-account JSON
      # (Firebase Console → Project settings → Service accounts → Generate
      # new private key) into FIREBASE_SERVICE_ACCOUNT_JSON.
      # Legacy/dev option: the FIREBASE_REFRESH_TOKEN + FIREBASE_CLIENT_ID
      # pair (from `firebase login`) still works out of the box.
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: agentos-7f01e
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_USER_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_REFRESH_TOKEN
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      # This email is promoted to superuser on first sign-in.
      - key: FIRST_SUPERUSER_EMAIL
        sync: false
