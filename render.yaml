# ─────────────────────────────────────────────────────────────────────────────
# AgentOS Studio — Render Blueprint (render.yaml)
# ─────────────────────────────────────────────────────────────────────────────
# Single-service deployment: one URL hosts everything.
#
#   https://agentos.onrender.com          → main React app (frontend)
#   https://agentos.onrender.com/admin    → backend admin console (Swagger UI)
#   https://agentos.onrender.com/api/v1/* → backend API
#   https://agentos.onrender.com/health   → health check
#
# To deploy:
#   1. Render → "New +" → "Blueprint" → connect this GitHub repo
#   2. Render creates ONE web service ("agentos")
#   3. Fill in the env vars marked `sync: false` (secrets) — the blueprint
#      prompts for them during first deploy.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: agentos
    runtime: python
    rootDir: backend
    plan: free
    region: singapore # closest Render region to the Aiven Postgres (Bangalore)
    buildCommand: |
      npm --prefix ../frontend ci
      npm --prefix ../frontend run build
      pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 22.18.0
      # Same-origin: the SPA is served from the same host as the API, so a
      # relative base URL works and no CORS config is required.
      - key: VITE_API_URL
        value: /api/v1
      - key: DATABASE_URL
        sync: false # e.g. postgresql+asyncpg://avnadmin:...@host:port/defaultdb?ssl=require
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: agentos-7f01e
      - key: FIREBASE_USER_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_REFRESH_TOKEN
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: FIRST_SUPERUSER_EMAIL
        sync: false
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false
