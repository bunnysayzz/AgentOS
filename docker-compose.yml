version: "3.9"

# ─── AgentOS Studio — Local dev ─────────────────────────────
# Data lives in Cloud Firestore (Firebase) — no database container needed.
# The backend verifies Firebase ID tokens and reads/writes Firestore
# directly. Firebase auth keys come from ./backend/.env.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    volumes:
      - ./backend:/app
      - agentos_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  agentos_data:
