<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-label="AgentOS Studio | Self-hosted agent studio. Your keys. Your data.">
  <defs>
    <radialGradient id="glow" cx="38%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#b8842f" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#b8842f" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#08080b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e3b862"/>
      <stop offset="1" stop-color="#b8842f"/>
    </linearGradient>
    <linearGradient id="ring" x1="3" y1="3" x2="21" y2="21">
      <stop stop-color="#e3b862"/>
      <stop offset="1" stop-color="#b8842f"/>
    </linearGradient>
    <linearGradient id="glyph" x1="7" y1="6.5" x2="17" y2="16.5">
      <stop stop-color="#e3b862"/>
      <stop offset="1" stop-color="#b8842f"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="#08080b"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- faint orbital accents -->
  <g opacity="0.05">
    <circle cx="1080" cy="60" r="180" fill="none" stroke="#e3b862" stroke-width="1"/>
    <circle cx="1080" cy="60" r="260" fill="none" stroke="#e3b862" stroke-width="1"/>
  </g>

  <!-- monogram badge -->
  <rect x="92" y="116" width="168" height="168" rx="40" fill="#16151a" stroke="#b8842f" stroke-opacity="0.45" stroke-width="2"/>
  <g transform="translate(124,148) scale(5)">
    <ellipse cx="12" cy="12" rx="9" ry="3.4" opacity="0.45" transform="rotate(-22 12 12)" stroke="url(#ring)" stroke-width="1.2"/>
    <path d="M7 16.5 12 6.5l5 10" stroke="url(#glyph)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9.2 13h5.6" opacity="0.85" stroke="url(#glyph)" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="12" cy="6.2" r="1.5" fill="#e3b862"/>
    <circle cx="12" cy="6.2" r="3" opacity="0.35" fill="#e3b862"/>
    <circle cx="20.2" cy="9" r="0.9" fill="#e3b862"/>
    <circle cx="3.8" cy="15" r="0.9" fill="#e3b862"/>
  </g>

  <!-- wordmark -->
  <text x="304" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#f5f5f4" letter-spacing="1">
    Agent<tspan fill="#e3b862">OS</tspan> Studio
  </text>

  <!-- tagline -->
  <text x="306" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" fill="#a1a1aa" letter-spacing="0.3">
    Self-hosted agent studio. <tspan fill="#e3b862" font-weight="600">Your keys. Your data.</tspan>
  </text>

  <!-- divider -->
  <line x1="306" y1="258" x2="620" y2="258" stroke="#3f3f46" stroke-width="1"/>

  <!-- capability line -->
  <text x="306" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#71717a" letter-spacing="0.4">
    Chat · Agents · Workflows · Tools · Secrets · Tracing · MCP
  </text>

  <!-- live demo pill -->
  <a href="https://letsagentos.onrender.com" target="_blank">
    <rect x="306" y="312" width="248" height="48" rx="24" fill="url(#gold)"/>
    <text x="430" y="343" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#141007" letter-spacing="0.3">Try the live demo  →</text>
  </a>
</svg>
